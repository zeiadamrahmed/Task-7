<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <!-- Google Fonts Roboto -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- MDB -->
    <link rel="stylesheet" href="css/mdb.min.css" />
    <title>login-Moderna</title>

    <link
      rel="icon"
      href="./img/Gemini_Generated_Image_kzovaqkzovaqkzov.jfif"
      type="image/x-icon"
    />
  </head>
  <body class="bg-light">
    <div class="container d-flex flex-column align-items-center py-3">
      <!-- Moderna Brand Header/Logo -->
      <a href="#" class="mb-2 text-decoration-none">
        <h1
          class="fw-bold m-0 text-danger"
          style="letter-spacing: -1px; font-size: 32px"
        >
          Moderna
        </h1>
      </a>

      <div class="col-12 col-sm-8 col-md-5 card p-3 shadow-sm rounded-3">
        <h3 class="mb-1 text-center fw-bold fs-4">Sign In</h3>
        <p class="text-muted text-center mb-3 small">
          Access your Moderna account
        </p>

        <form action="completed.html" method="post">
          <div class="mb-2">
            <label for="inputEmail3" class="form-label mb-1 small fw-medium"
              >Email or Username</label
            >

            <input
              type="email"
              name="email"
              id="inputEmail3"
              class="form-control form-control-sm"
              placeholder="name@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="mb-3">
            <label for="inputPassword" class="form-label mb-1 small fw-medium"
              >Password</label
            >

            <input
              type="password"
              class="form-control form-control-sm"
              id="inputPassword"
              placeholder="Enter your password"
              required
            />
          </div>

          <button
            type="submit"
            class="btn btn-danger w-100 py-2 mb-2 text-center"
          >
            Sign In
          </button>
        </form>

        <!-- Footer Section inside card -->
        <div class="text-center mt-2 text-muted" style="font-size: 11px">
          © 2026 Moderna, Inc. All rights reserved.
        </div>
      </div>
    </div>

    <!-- MDB -->
    <script type="text/javascript" src="js/mdb.umd.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
